<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Precipice Analytica</title>

  <!-- Playfair Display -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#F8F9FA;
      --panel:#FFFFFF;
      --border:#E3E6EA;
      --text:#1E1E1E;
      --muted:#6C757D;
      --navy:#0D1B2A;
      --gold:#C6A14A;
      --green:#1E7F4F;
      --red:#B23A3A;
      --chip:#F1F3F5;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:'Playfair Display', serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:1180px;
      margin:0 auto;
      padding:32px 20px;
    }

    .h1{
      font-size:42px;
      font-weight:700;
      margin:0;
    }

    .h2{
      font-size:17px;
      margin-top:6px;
      color:var(--muted);
    }

    .sub{
      margin-top:8px;
      font-size:14px;
      color:var(--muted);
      max-width:800px;
      line-height:1.5;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:12px;
      padding:18px;
      margin-top:22px;
      box-shadow:0 4px 14px rgba(0,0,0,.04);
    }

    .bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      margin-top:20px;
    }

    .pillbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .pill{
      background:var(--chip);
      border:1px solid var(--border);
      padding:6px 12px;
      border-radius:999px;
      font-size:13px;
      color:var(--muted);
    }

    .pill b{
      color:var(--navy);
      font-weight:600;
    }

    .btn{
      background:var(--navy);
      color:white;
      border:none;
      border-radius:6px;
      padding:10px 16px;
      cursor:pointer;
      font-size:14px;
      font-weight:600;
    }

    .btn.secondary{
      background:white;
      border:1px solid var(--border);
      color:var(--text);
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-top:24px;
    }

    @media (max-width: 980px){
      .grid{grid-template-columns:1fr}
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }

    th,td{
      border-bottom:1px solid var(--border);
      padding:10px 8px;
    }

    th{
      text-align:left;
      font-weight:600;
      color:var(--muted);
    }

    tr:hover td{
      background:#FAFBFC;
    }

    .right{text-align:right}

    .good{color:var(--green); font-weight:600}
    .bad{color:var(--red); font-weight:600}

    .addbtn{
      background:var(--chip);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
      font-size:12px;
    }

    .logbox{
      height:250px;
      overflow:auto;
      background:#FAFBFC;
      border:1px solid var(--border);
      border-radius:8px;
      padding:12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size:12px;
      white-space:pre-wrap;
    }

    .tabs{
      display:flex;
      gap:8px;
      margin:10px 0;
    }

    .tab{
      padding:6px 12px;
      border-radius:6px;
      border:1px solid var(--border);
      background:var(--chip);
      cursor:pointer;
      font-size:12px;
    }

    .tab.active{
      background:var(--navy);
      color:white;
      border-color:var(--navy);
    }

    .select{
      padding:6px 10px;
      border:1px solid var(--border);
      border-radius:6px;
      font-family:'Playfair Display', serif;
    }

  </style>
</head>

<body>
<div class="wrap">

  <div>
    <div class="h1">Precipice <span style="font-style:italic;">Analytica</span></div>
    <div class="h2">Systematic Equity Signals & Short-Interest Research</div>
    <div class="sub">
      Quantitative detection of inflection points through liquidity structure,
      price behavior and borrow metrics.
    </div>

    <div class="bar">
      <div class="pillbar">
        <div class="pill" id="pillMode">Mode: <b>auto</b></div>
        <div class="pill" id="pillWindow">Window: <b>—</b></div>
        <div class="pill" id="pillOrtex">ORTEX: <b>—</b></div>
        <div class="pill" id="pillLast">Last Scan: <b>—</b></div>
      </div>

      <div>
        <button class="btn" id="btnScan">Scan Stocks</button>
        <button class="btn secondary" id="btnClear">Clear Log</button>
      </div>
    </div>
  </div>


<script>
  // -------------------------
  // State
  // -------------------------
  let selectedMode = localStorage.getItem("squeeze_mode") || "auto";
  let selectedOrtex = localStorage.getItem("squeeze_ortex") || "auto";

  let showing = "SQUEEZE";
  let scanId = null;
  let es = null;

  let scannedCount = null; // parsed from logs
  let lastUpdatedStr = "—";

  const results = { SQUEEZE: [], MOMENTUM: [] };
  const el = (id) => document.getElementById(id);

  function setMode(mode){
    selectedMode = mode;
    localStorage.setItem("squeeze_mode", mode);
    el("pillMode").innerHTML = `Mode: <b>${mode}</b>`;
  }
  function setOrtex(v){
    selectedOrtex = v;
    localStorage.setItem("squeeze_ortex", v);
    const label = (v === "auto") ? "AUTO" : (v === "on" ? "ON" : "OFF");
    el("pillOrtex").innerHTML = `ORTEX: <b>${label}</b>`;
  }

  // -------------------------
  // Log + meta parsing (so we don't need backend edits)
  // -------------------------
  function log(line){
    const box = el("logBox");
    box.textContent += (line + "\n");
    box.scrollTop = box.scrollHeight;
    parseMetaFromLog(line);
  }

  function parseMetaFromLog(line){
    // Snapshot tickers received: 4212
    const m1 = line.match(/Snapshot tickers received:\s*(\d+)/i);
    if(m1){
      scannedCount = Number(m1[1]);
      updateMetaLines();
    }

    // Market window: PREMARKET (03:00–07:12 CT)
    const m2 = line.match(/Market window:\s*([A-Z \(\)]+)\s*\(/i);
    if(m2){
      el("pillWindow").innerHTML = `Window: <b>${m2[1].trim()}</b>`;
    }
  }

  function updateMetaLines(){
    const scanned = (scannedCount == null) ? "—" : scannedCount.toLocaleString();
    el("resultsMeta").textContent = `US Equities • Updated ${lastUpdatedStr} • ${scanned} scanned`;
    el("noteMeta").textContent = `US Equities • Updated ${lastUpdatedStr} • ${scanned} scanned`;
  }

  function fmtNum(x, nd=2){
    if(x === null || x === undefined) return "NA";
    const n = Number(x);
    if(Number.isNaN(n)) return "NA";
    return n.toFixed(nd);
  }
  function fmtPct(x){
    if(x === null || x === undefined) return "NA";
    const n = Number(x);
    if(Number.isNaN(n)) return "NA";
    const p = n * 100;
    const sign = p > 0 ? "+" : "";
    return sign + p.toFixed(1) + "%";
  }
  function fmtInt(x){
    if(x === null || x === undefined) return "NA";
    const n = Number(x);
    if(Number.isNaN(n)) return "NA";
    return Math.round(n).toLocaleString();
  }

  function renderResults(){
    const body = el("resultsBody");
    body.innerHTML = "";
    const list = results[showing] || [];

    for(const r of list){
      const tr = document.createElement("tr");
      tr.style.cursor = "pointer";
      tr.innerHTML = `
        <td><b>${r.ticker || ""}</b></td>
        <td>${r.confidence ?? ""}</td>
        <td>${r.subtype || ""}</td>
        <td class="right">${fmtNum(r.close,2)}</td>
        <td class="right">${fmtPct(r.move_pct)}</td>
        <td class="right">${fmtInt(r.float_shares)}</td>
        <td class="right"><button class="addbtn" data-t="${r.ticker}">Add</button></td>
      `;

      tr.addEventListener("click", (e) => {
        if(e.target && e.target.matches("button.addbtn")) return;
        const planBox = el("planBox");
        planBox.style.display = "block";
        planBox.textContent =
          `${r.ticker} — ${r.subtype}\n\n` +
          (r.plan || "(no plan)") + "\n\n" +
          `Trigger: ${fmtNum(r.trigger,4)} | Stop: ${fmtNum(r.stop,4)}\n` +
          `Range: ${fmtPct(r.range_pct)} | Hold: ${fmtPct(r.hold_pct)} | RelVol: ${fmtNum(r.rel_vol,2)}\n` +
          `SI%: ${fmtNum(r.si_pct_ff,1)} | CTB: ${fmtNum(r.ctb,1)} | Avail: ${fmtInt(r.avail)}\n` +
          `$Vol: ${fmtInt(r.dollar_vol)}`
      });

      body.appendChild(tr);
    }

    body.querySelectorAll("button.addbtn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const tkr = btn.getAttribute("data-t");
        const row = (results.SQUEEZE.concat(results.MOMENTUM)).find(x => x.ticker === tkr);
        if(!row) return;

        const entry = prompt(`Entry price for ${tkr}?`, row.close ? String(row.close) : "");
        if(entry === null) return;
        const shares = prompt(`Shares for ${tkr}?`, "100");
        if(shares === null) return;

        await createTradeFromRow(row, entry, shares);
        await loadNotebook();
      });
    });
  }

  // Tabs
  el("tabSqueeze").addEventListener("click", () => {
    showing = "SQUEEZE";
    el("tabSqueeze").classList.add("active");
    el("tabMomentum").classList.remove("active");
    renderResults();
  });
  el("tabMomentum").addEventListener("click", () => {
    showing = "MOMENTUM";
    el("tabMomentum").classList.add("active");
    el("tabSqueeze").classList.remove("active");
    renderResults();
  });

  // Scan
  async function runScan(){
    el("btnScan").disabled = true;
    el("logStatus").textContent = "Running…";
    el("planBox").style.display = "none";
    el("planBox").textContent = "";

    results.SQUEEZE = [];
    results.MOMENTUM = [];
    scannedCount = null;

    if(es){ try{ es.close(); }catch(e){} es = null; }

    lastUpdatedStr = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    el("pillLast").innerHTML = `Last Scan: <b>${lastUpdatedStr}</b>`;
    updateMetaLines();
    renderResults();

    const mode = selectedMode || "auto";
    const ortex = selectedOrtex || "auto";

    const resp = await fetch(`/run_scan?mode=${encodeURIComponent(mode)}&ortex=${encodeURIComponent(ortex)}`, { method:"POST" });
    const data = await resp.json();

    if(!data.ok){
      el("logStatus").textContent = "Error starting scan.";
      el("btnScan").disabled = false;
      return;
    }

    scanId = data.scan_id;
    el("pillMode").innerHTML = `Mode: <b>${(data.mode || mode)}</b>`;
    // window/ortex will update from logs (or keep previous)

    es = new EventSource(`/stream/${scanId}`);

    es.addEventListener("log", (ev) => {
      try{
        const j = JSON.parse(ev.data);
        log(j.line || ev.data);
      }catch(e){
        log(ev.data);
      }
    });

    es.addEventListener("row", (ev) => {
      let r;
      try{ r = JSON.parse(ev.data); }catch(e){ return; }
      const bucket = (r.bucket || "").toUpperCase() === "SQUEEZE" ? "SQUEEZE" : "MOMENTUM";
      const arr = results[bucket];
      arr.push(r);
      results[bucket] = arr.slice(0,5);
      renderResults();
    });

    es.addEventListener("done", (ev) => {
      let j = {};
      try{ j = JSON.parse(ev.data); }catch(e){}
      el("logStatus").textContent = j.ok ? "Done." : "Done (error).";
      el("btnScan").disabled = false;

      setTimeout(() => { if(es){ try{ es.close(); }catch(e){} es=null; } }, 1200);
    });
  }

  el("btnScan").addEventListener("click", runScan);

  // Clear log
  el("btnClear").addEventListener("click", async () => {
    await fetch("/clear_log", { method:"POST" });
    el("logBox").textContent = "";
    el("logStatus").textContent = "Cleared.";
  });

  // -------------------------
  // Notebook (same endpoints you already have)
  // -------------------------
  async function loadNotebook(){
    const view = el("noteView").value;
    const resp = await fetch(`/api/trades?view=${encodeURIComponent(view)}&user_id=demo`);
    const data = await resp.json();
    if(!data.ok) return;

    const rows = data.trades || [];
    const body = el("noteBody");
    body.innerHTML = "";

    for(const t of rows){
      const pnlD = t.pnl_dollars;
      const pnlP = t.pnl_pct;

      const pnlDStr = (pnlD == null) ? "—" : (pnlD >= 0 ? `<span class="good">+${pnlD.toFixed(2)}</span>` : `<span class="bad">${pnlD.toFixed(2)}</span>`);
      const pnlPStr = (pnlP == null) ? "—" : (pnlP >= 0 ? `<span class="good">+${(pnlP*100).toFixed(1)}%</span>` : `<span class="bad">${(pnlP*100).toFixed(1)}%</span>`);

      const flags = (() => { try{ return JSON.parse(t.review_flags || "[]"); }catch(e){ return []; } })();
      const flagsStr = (flags || []).map(f => `${f.icon||""} ${f.label||""}`.trim()).join(" • ");

      const tr = document.createElement("tr");
      tr.style.cursor = "pointer";
      tr.innerHTML = `
        <td><b>${t.ticker}</b></td>
        <td>${t.subtype || ""}</td>
        <td>${t.confidence ?? ""}</td>
        <td class="right">${t.entry_price != null ? Number(t.entry_price).toFixed(2) : "—"}</td>
        <td class="right">${t.exit_price != null ? Number(t.exit_price).toFixed(2) : "—"}</td>
        <td class="right">${t.shares != null ? Number(t.shares).toFixed(0) : "—"}</td>
        <td class="right">${pnlDStr}</td>
        <td class="right">${pnlPStr}</td>
        <td>${flagsStr || ""}</td>
        <td class="right">
          ${t.exit_price == null ? `<button class="addbtn" data-close="${t.id}">Close</button>` : "—"}
        </td>
      `;

      tr.addEventListener("click", (e) => {
        if(e.target && e.target.matches("button")) return;
        const planBox = el("planBox");
        planBox.style.display = "block";
        planBox.textContent =
          `TRADE ${t.ticker}\n\n` +
          `Setup: ${t.subtype || ""} | Conf: ${t.confidence ?? ""}\n` +
          `Entry: ${t.entry_price} @ ${t.entry_time_ct}\n` +
          `Exit: ${t.exit_price ?? "—"} @ ${t.exit_time_ct ?? "—"}\n\n` +
          `Scanner Snapshot:\n` +
          `Trigger: ${t.trigger ?? "—"} | Stop: ${t.stop ?? "—"}\n` +
          `Move: ${t.move_pct ?? "—"} | $Vol: ${t.dollar_vol ?? "—"}\n` +
          `Range: ${t.range_pct ?? "—"} | Hold: ${t.hold_pct ?? "—"} | RelVol: ${t.rel_vol ?? "—"}\n` +
          `SI%: ${t.si_pct_ff ?? "—"} | CTB: ${t.ctb ?? "—"} | Avail: ${t.avail ?? "—"}\n\n` +
          (t.plan || "");
      });

      body.appendChild(tr);
    }

    body.querySelectorAll("button[data-close]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute("data-close");
        const px = prompt("Exit price?", "");
        if(px === null) return;
        await fetch(`/api/trades/${id}?user_id=demo`, {
          method:"PATCH",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ exit_price: px })
        });
        await loadNotebook();
      });
    });
  }

  async function createTradeFromRow(row, entryPrice, shares){
    const payload = {
      user_id: "demo",
      scan_id: scanId,
      scan_date_ct: null,
      ticker: row.ticker,
      bucket: row.bucket,
      subtype: row.subtype,
      confidence: row.confidence,
      plan: row.plan,
      trigger: row.trigger,
      stop: row.stop,
      scan_close: row.close,
      move_pct: row.move_pct,
      dollar_vol: row.dollar_vol,
      range_pct: row.range_pct,
      hold_pct: row.hold_pct,
      rel_vol: row.rel_vol,
      float_shares: row.float_shares,
      entry_price: entryPrice,
      shares: shares
    };

    await fetch("/api/trades", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });
  }

  el("noteView").addEventListener("change", loadNotebook);

  // Boot
  setMode(selectedMode);
  setOrtex(selectedOrtex);
  updateMetaLines();
  loadNotebook().catch(()=>{});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Squeeze Bot</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #e6edf3;
}

.topbar {
  padding: 12px 16px;
  background: #111827;
  display: flex;
  gap: 12px;
  align-items: center;
}

button {
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button.run { background: #2563eb; color: white; }

.chip {
  background: #1f2937;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 13px;
}

.layout {
  display: grid;
  grid-template-columns: 380px 1fr;
  height: calc(100vh - 60px);
}

.log {
  background: #020617;
  padding: 10px;
  overflow: auto;
  font-family: monospace;
  font-size: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 8px;
  border-bottom: 1px solid #1f2937;
  font-size: 13px;
}

tr:hover { background: #111827; cursor: pointer; }

.details {
  background: #020617;
  padding: 10px;
  font-size: 13px;
}

.legend {
  font-size: 12px;
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="topbar">
  <button class="run" onclick="startScan()">Scan Stocks</button>
  <div class="chip">Pre 3:00–8:29 • Reg 8:30–3:00 • AH 3:00–7:00 (CT)</div>
</div>

<div class="chip legend">
  Conf=1–10 • Move=% vs yesterday • $Vol=dollar volume •
  Window=minutes scanned • Hold Strength=where price closed in range
</div>

<div class="layout">
  <div class="log" id="log"></div>

  <div style="overflow:auto">
    <table id="tbl">
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Conf</th>
          <th>Subtype</th>
          <th>Price</th>
          <th>Move</th>
          <th>$Vol</th>
          <th>Window</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
let evt;

function startScan() {
  document.querySelector("#tbl tbody").innerHTML = "";
  document.getElementById("log").textContent = "";
  fetch("/run_scan", { method: "POST" })
    .then(r => r.json())
    .then(j => {
      evt = new EventSource(`/stream/${j.scan_id}`);
      evt.onmessage = () => {};
      evt.addEventListener("log", e => {
        document.getElementById("log").textContent += JSON.parse(e.data).line + "\n";
      });
      evt.addEventListener("row", e => addRow(JSON.parse(e.data)));
    });
}

function addRow(r) {
  const tbody = document.querySelector("#tbl tbody");
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><b>${r.ticker}</b></td>
    <td>${r.confidence}</td>
    <td>${r.subtype}</td>
    <td>${r.close}</td>
    <td>${r.move_pct}%</td>
    <td>${fmtNum(r.dollar_vol)}</td>
    <td>${r.window_minutes} min</td>
  `;
  tr.onclick = () => showDetails(tr, r);
  tbody.appendChild(tr);
}

function showDetails(tr, r) {
  const det = document.createElement("tr");
  det.innerHTML = `
    <td colspan="7" class="details">
      <b>Trigger:</b> ${r.trigger} |
      <b>Stop:</b> ${r.stop} |
      <b>Hold Strength:</b> ${r.hold_strength_pct}% |
      <b>Range:</b> ${r.range_pct}% |
      <b>Window:</b> ${r.window_label}<br><br>
      <b>Plan:</b> ${r.plan}
    </td>
  `;
  tr.after(det);
  tr.onclick = null;
}

function fmtNum(n) {
  if (!n) return "NA";
  if (n > 1e6) return (n/1e6).toFixed(2) + "M";
  if (n > 1e3) return (n/1e3).toFixed(1) + "K";
  return n;
}
</script>

</body>
</html>

<button id="run">Run Scan</button>
<pre id="out"></pre>


<script>
  const out = document.getElementById("out");
  let pollInterval = null;

  document.getElementById("run").onclick = async () => {
    out.textContent = "Starting scan...\n";

    const res = await fetch("/run_scan", { method: "POST" });
    const data = await res.json();

    if (!data.log_url) {
      out.textContent += "Failed to start scan.";
      return;
    }

    out.textContent += "Scan started.\n\n";
    const logUrl = data.log_url;

    // stop any previous polling
    if (pollInterval) clearInterval(pollInterval);

    // poll logs every 2 seconds
    pollInterval = setInterval(async () => {
      const logRes = await fetch(logUrl);
      const logData = await logRes.json();

      if (logData.log) {
        out.textContent = logData.log;
        out.scrollTop = out.scrollHeight;
      }
    }, 2000);
  };
</script>
